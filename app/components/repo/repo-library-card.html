<details class="repo-library-card repo-collapsible-card" aria-labelledby="repoLibraryTitle" open>
  <summary class="repo-collapsible-summary">
    <div>
      <h2 id="repoLibraryTitle">Saved Repos</h2>
      <p>SQLite-backed uploads ready for mapping.</p>
    </div>

    <span class="repo-collapsible-chevron" aria-hidden="true" data-icon="chevron-right"></span>
  </summary>

  <div class="repo-collapsible-body">
    <button
      class="mini-icon-btn"
      type="button"
      id="refreshReposBtn"
      aria-label="Refresh repos"
    >
      <span data-icon="refresh"></span>
    </button>

    <div class="repo-list" id="repoList"></div>
  </div>
</details>
