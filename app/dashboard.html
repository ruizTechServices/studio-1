<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>studio-1 Dashboard</title>
    <link rel="stylesheet" href="./css/main.css">
  </head>
  <body data-page="dashboard">
    <div class="product-shell">
      <button class="mobile-nav-toggle" type="button" aria-label="Open navigation" aria-controls="siteSidebar" aria-expanded="false" data-shell-nav-toggle>
        <span></span>
        <span></span>
        <span></span>
      </button>

      <aside class="sidebar" id="siteSidebar" aria-label="Sidebar">
        <div class="brand">
          <span class="logo-mark" aria-hidden="true"></span>
          <span class="brand-name">studio-1</span>
        </div>

        <nav class="primary-nav" id="primaryNav" aria-label="Primary"></nav>

        <section class="project-nav" aria-label="Projects">
          <div class="section-heading">
            <span>Projects</span>
          </div>
          <div id="projectNav"></div>
        </section>
      </aside>
      <button class="shell-backdrop" type="button" aria-label="Close navigation" data-shell-backdrop hidden></button>

      <main class="workspace">
        <header class="topbar" aria-label="Utility bar">
          <label class="search-box" aria-label="Search">
            <span data-icon="search"></span>
            <input id="searchInput" type="search" placeholder="Search...">
            <kbd>&#8984;K</kbd>
          </label>
          <button class="top-icon-btn" type="button" aria-label="Calendar" data-toast="Calendar">
            <span data-icon="calendar"></span>
          </button>
          <button class="top-icon-btn" type="button" aria-label="Notifications" data-toast="Notifications">
            <span data-icon="bell"></span>
          </button>
          <button class="avatar-button" type="button" aria-label="Account" data-toast="Account menu">
            <span class="avatar-portrait" aria-hidden="true"></span>
          </button>
        </header>

        <div class="workspace-main">
          <section class="dashboard-content" aria-label="Dashboard">
            <div class="overview-row">
              <div class="welcome-copy">
                <h1>Welcome back, Gio <span aria-hidden="true">&#128075;</span></h1>
                <p>Here's what's happening with your projects and AI teammates.</p>
              </div>
              <div class="kpi-strip" id="kpiStrip"></div>
            </div>

          </section>

          <form class="command-bar" id="commandForm" aria-label="Command input">
            <span class="command-icon" data-icon="message"></span>
            <input id="commandInput" type="text" autocomplete="off" placeholder="Ask studio-1 anything...">
            <label class="toggle-label">
              <span>Deep Research</span>
              <button class="toggle-switch" id="researchToggle" type="button" aria-pressed="false" aria-label="Toggle Deep Research">
                <span></span>
              </button>
            </label>
            <button class="attach-btn" type="button" aria-label="Attach file" data-toast="Attach file">
              <span data-icon="paperclip"></span>
            </button>
            <button class="send-btn" type="submit" aria-label="Send">
              <span data-icon="arrow-up"></span>
            </button>
          </form>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
